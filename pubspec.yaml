name: sensor_track
description: Aplicación móvil para monitorear y guardar mediciones de sensores.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^1.1.1
  flutter_dotenv: ^6.0.2
  geolocator: ^14.0.2
  material_ui: ^1.1.0
  sensors_plus: ^7.1.1
  supabase_flutter: ^2.14.1
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
